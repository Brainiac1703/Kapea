schema: spec-driven

context: |
  Proyecto: Kapea. Repositorio nuevo, aún sin código.

  Stack (mismo que el proyecto legacy-lens del mismo equipo):
  - .NET 10 (SDK 10.0.300, rollForward latestFeature; fijado en global.json).
  - C#, con constructores primarios para la inyección por constructor.
  - Frontend Blazor WebAssembly (decidido en la propuesta inicial): el cliente
    corre en el navegador y no puede custodiar secretos, por lo que existe
    siempre una Web API ASP.NET Core intermedia que guarda y usa las API keys
    de los brokers y expone los endpoints que consume el cliente.
  - Solución en formato .slnx; gestión centralizada de versiones de paquetes
    (Directory.Packages.props, ManagePackageVersionsCentrally + pinning
    transitivo).
  - Arquitectura por capas con las dependencias apuntando hacia dentro:
    Domain sin dependencias, Application con CQRS (MediatR) + FluentValidation,
    adaptador de persistencia con EF Core + SQL Server, Web solo conoce ISender.
    Ajustar a lo que Kapea necesite, pero mantener la dirección de dependencias.

  Convenciones de idioma:
  - Identificadores, nombres de fichero, rutas y URLs de páginas: en inglés.
  - Comentarios y documentación: en español. Un comentario en español que cita
    un identificador lo escribe con su nombre real en inglés.
  - Texto que ve el usuario: en ficheros de recursos, nunca literal en el
    código. es-ES por omisión, en como alternativo.
  - Mensajes de log: en español y sin localizar.
  - Nombres de tests y sus variables locales: en inglés, aunque se lean como
    frase.
  - En los YAML de pipeline: nombres de job/step/output/input/env/variable en
    inglés (incluido el name: visible en Actions); comentarios y echo en
    español.

  Convenciones de código:
  - PascalCase en lo público, camelCase en locales y parámetros, _camelCase en
    campos privados.
  - Inyección por constructor; nada de localizador de servicios ni estado
    estático (GetRequiredService solo en la raíz de composición, seeders y
    registro de endpoints).
  - async/await para toda E/S; nunca .Result ni .Wait().
  - Estilos en app.css (globales) o en el .razor.css del componente; nunca en el
    atributo style.
  - Comentarios: el "qué" sobra; se documenta el "por qué" (decisiones con
    alternativas, trampas, límites de bibliotecas). Nada de resúmenes de cambios
    en el código: eso es del historial de git.

